<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Audio Waveform Bars (Background pattern) -->
  <g fill="rgba(255,255,255,0.15)">
    <rect x="96" y="220" width="16" height="72" rx="8" />
    <rect x="128" y="180" width="16" height="152" rx="8" />
    <rect x="368" y="180" width="16" height="152" rx="8" />
    <rect x="400" y="220" width="16" height="72" rx="8" />
  </g>

  <!-- Central Microphone & Voice Emblem -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="216" y="140" width="80" height="144" rx="40" fill="#ffffff" />
    <!-- Mic Inner Accent -->
    <rect x="236" y="160" width="40" height="70" rx="20" fill="url(#accentGrad)" />

    <!-- Mic Cradle U-Shape -->
    <path d="M176 230 C176 304, 336 304, 336 230" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
    <!-- Stand Neck -->
    <line x1="256" y1="304" x2="256" y2="368" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
    <!-- Stand Base -->
    <line x1="200" y1="368" x2="312" y2="368" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />

    <!-- Sparkle Stars -->
    <path d="M360 120 Q370 140 390 140 Q370 140 360 160 Q350 140 330 140 Q350 140 360 120 Z" fill="url(#accentGrad)" />
    <circle cx="150" cy="150" r="12" fill="url(#accentGrad)" />
  </g>
</svg>
